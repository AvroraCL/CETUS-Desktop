<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CETUS · 更新公告</title>
<meta name="description" content="CETUS鲸鱼座 更新公告：每次版本更新的完整说明。">
<style>
  :root {
    --bg: #0c111b;
    --bg-card: #131a28;
    --bg-soft: #1a2334;
    --border: #24304a;
    --text: #e6ecf7;
    --text-dim: #93a1ba;
    --accent: #4f8df7;
    --accent-soft: rgba(79, 141, 247, 0.14);
    --mono: Consolas, "Cascadia Mono", "JetBrains Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.75 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  .hero {
    padding: 64px 20px 40px;
    text-align: center;
    background: radial-gradient(ellipse 60% 90% at 50% -10%, #17233c 0%, var(--bg) 70%);
  }
  .hero img { width: 88px; height: 88px; border-radius: 20px; }
  .hero h1 { margin: 18px 0 6px; font-size: 30px; letter-spacing: 0.5px; }
  .hero h1 span { color: var(--accent); }
  .hero p { margin: 0; color: var(--text-dim); }
  main { max-width: 780px; margin: 0 auto; padding: 12px 20px 72px; }
  .state { text-align: center; color: var(--text-dim); padding: 56px 0; }
  .state a { color: var(--accent); }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 26px;
    margin: 18px 0;
  }
  .card.current {
    border-color: var(--accent);
    background: linear-gradient(var(--accent-soft), var(--accent-soft)), var(--bg-card);
  }
  .card-head {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 4px;
  }
  .tag {
    font-family: var(--mono);
    font-size: 17px;
    font-weight: 600;
    color: var(--accent);
  }
  .badge {
    font-size: 12px;
    color: #0c111b;
    background: var(--accent);
    border-radius: 999px;
    padding: 2px 10px;
    font-weight: 600;
  }
  .date { color: var(--text-dim); font-size: 13px; margin-left: auto; }
  .notes { color: var(--text); }
  .notes h1, .notes h2, .notes h3, .notes h4 { margin: 18px 0 8px; line-height: 1.4; }
  .notes h1 { font-size: 19px; } .notes h2 { font-size: 17px; } .notes h3 { font-size: 15px; }
  .notes p { margin: 8px 0; }
  .notes ul, .notes ol { margin: 8px 0; padding-left: 24px; }
  .notes li { margin: 4px 0; }
  .notes code {
    font-family: var(--mono);
    font-size: 13px;
    background: var(--bg-soft);
    border-radius: 5px;
    padding: 1px 6px;
  }
  .notes pre {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    overflow-x: auto;
  }
  .notes pre code { background: none; padding: 0; }
  .notes a { color: var(--accent); }
  .notes blockquote {
    margin: 8px 0;
    padding: 2px 14px;
    border-left: 3px solid var(--accent);
    color: var(--text-dim);
  }
  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    padding: 28px 0 40px;
  }
  footer a { color: var(--accent); margin: 0 8px; }
</style>
</head>
<body>
<div class="hero">
  <img src="CETUS-ico.png" alt="CETUS 图标">
  <h1>CETUS<span> · </span>更新公告</h1>
  <p>每一次更新都记录在这里</p>
</div>
<main>
  <div id="content" class="state">正在加载版本公告…</div>
</main>
<footer>
  <a href="https://github.com/AvroraCL/CETUS-Desktop/releases" target="_blank" rel="noopener">GitHub Releases</a>·
  <a href="https://gitcode.com/HelenaSG/CETUS-Desktop/releases" target="_blank" rel="noopener">GitCode Releases</a>
</footer>
<script>
(function () {
  "use strict";

  var params = new URLSearchParams(location.search);
  var highlight = params.get("to");
  if (highlight) {
    highlight = highlight.replace(/^v/i, "").trim();
  }

  var content = document.getElementById("content");

  // Mini markdown renderer: headings, lists, quotes, fenced code and the
  // inline styles release notes actually use. Everything is HTML-escaped
  // first, so the page never injects raw release content.
  function inline(text) {
    return text
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*]+)\*/g, "<em>$1</em>")
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (all, label, href) {
        if (!/^https?:\/\//i.test(href)) { return label; }
        return '<a href="' + href + '" target="_blank" rel="noopener">' + label + "</a>";
      });
  }

  function renderMarkdown(source) {
    var out = [];
    var list = null;
    var inFence = false;
    var fence = [];
    var lines = source.replace(/\r\n/g, "\n").split("\n");

    function closeList() {
      if (list) { out.push("</" + list + ">"); list = null; }
    }

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      if (/^```/.test(line.trim())) {
        if (inFence) {
          out.push("<pre><code>" + fence.join("\n") + "</code></pre>");
          fence = [];
          inFence = false;
        } else {
          closeList();
          inFence = true;
        }
        continue;
      }
      if (inFence) { fence.push(line); continue; }

      // Escape before anything else: release content must never inject HTML.
      var trimmed = escapeHtml(line.trim());
      if (!trimmed) { closeList(); continue; }

      var heading = /^(#{1,4})\s+(.*)$/.exec(trimmed);
      if (heading) {
        closeList();
        var level = heading[1].length;
        out.push("<h" + level + ">" + inline(heading[2]) + "</h" + level + ">");
        continue;
      }
      var bullet = /^[-*]\s+(.*)$/.exec(trimmed);
      if (bullet) {
        if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; }
        out.push("<li>" + inline(bullet[1]) + "</li>");
        continue;
      }
      var ordered = /^\d+[.)]\s+(.*)$/.exec(trimmed);
      if (ordered) {
        if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; }
        out.push("<li>" + inline(ordered[1]) + "</li>");
        continue;
      }
      if (/^&gt;/.test(trimmed)) {
        closeList();
        out.push("<blockquote>" + inline(trimmed.replace(/^&gt;\s*/, "")) + "</blockquote>");
        continue;
      }
      closeList();
      out.push("<p>" + inline(trimmed) + "</p>");
    }
    if (inFence) { out.push("<pre><code>" + fence.join("\n") + "</code></pre>"); }
    closeList();
    return out.join("\n");
  }

  function escapeHtml(text) {
    return String(text == null ? "" : text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function renderReleases(releases) {
    var usable = (releases || []).filter(function (item) {
      return item && item.tag_name;
    });
    if (!usable.length) {
      throw new Error("empty feed");
    }

    var html = [];
    usable.forEach(function (item) {
      var tag = String(item.tag_name).replace(/^v/i, "");
      var isCurrent = highlight && tag === highlight;
      var date = item.published_at ? new Date(item.published_at) : null;
      var dateText = date && !isNaN(date.getTime())
        ? date.getFullYear() + " 年 " + (date.getMonth() + 1) + " 月 " + date.getDate() + " 日"
        : "";
      html.push(
        '<section class="card' + (isCurrent ? " current" : "") + '" id="v' + escapeHtml(tag) + '">' +
        '<div class="card-head">' +
        '<span class="tag">v' + escapeHtml(tag) + "</span>" +
        (isCurrent ? '<span class="badge">本次更新</span>' : "") +
        (dateText ? '<span class="date">' + dateText + "</span>" : "") +
        "</div>" +
        '<div class="notes">' + renderMarkdown(item.body || "（本次发布没有附带更新说明。）") + "</div>" +
        "</section>");
    });
    content.className = "";
    content.innerHTML = html.join("\n");

    if (highlight) {
      var target = document.getElementById("v" + highlight.replace(/[^0-9.]/g, ""));
      if (target) {
        target.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }
  }

  function showFallback() {
    content.className = "state";
    content.innerHTML =
      "公告暂时加载失败。<br>" +
      '可以前往 <a href="https://github.com/AvroraCL/CETUS-Desktop/releases" target="_blank" rel="noopener">GitHub</a> 或 ' +
      '<a href="https://gitcode.com/HelenaSG/CETUS-Desktop/releases" target="_blank" rel="noopener">GitCode</a> 查看发布说明。';
  }

  var sources = [
    "https://api.github.com/repos/AvroraCL/CETUS-Desktop/releases?per_page=20",
    "https://gitcode.com/api/v5/repos/HelenaSG/CETUS-Desktop/releases?page=1&per_page=20"
  ];

  (function load(index) {
    if (index >= sources.length) {
      showFallback();
      return;
    }
    fetch(sources[index], { headers: { Accept: "application/json" } })
      .then(function (response) {
        if (!response.ok) { throw new Error(String(response.status)); }
        return response.json();
      })
      .then(renderReleases)
      .catch(function () { load(index + 1); });
  })(0);
})();
</script>
</body>
</html>
